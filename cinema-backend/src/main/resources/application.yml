server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: cinema-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${CINEMA_DB_USERNAME:root}
    # 密码不落盘, 启动前设置环境变量 CINEMA_DB_PASSWORD(或 --spring.datasource.password=...)
    password: ${CINEMA_DB_PASSWORD:147258}
  # Redis: 缓存热点排片与电影列表(当前本机 Redis 未启动, 代码已做降级, 缺失时自动回源数据库)
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 800ms
      connect-timeout: 800ms
  cache:
    type: none
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.cinema: info
