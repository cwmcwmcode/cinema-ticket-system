server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: cinema-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${CINEMA_DB_USERNAME:root}
    # 密码不落盘, 启动前设置环境变量 CINEMA_DB_PASSWORD(或 --spring.datasource.password=...)
    password: ${CINEMA_DB_PASSWORD:147258}
  # Redis: 本地单机, 既用于缓存热点排片/电影列表, 也用于 Redisson 座位分布式锁
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
  cache:
    type: none
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.cinema: info
